# Default deny, then allow: same namespace, the load balancer, DNS, and egress
# outside the cluster pod range (Google APIs, Cloud SQL via PSA, etc.).
# Result: one customer's pods can never talk to another customer's pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: {{ .Values.customer }}
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-customer
  namespace: {{ .Values.customer }}
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-load-balancer
  namespace: {{ .Values.customer }}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        {{- range .Values.network.lbSourceRanges }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-and-external-egress
  namespace: {{ .Values.customer }}
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - {{ .Values.network.clusterPodCidr }}
