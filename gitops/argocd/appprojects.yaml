# One AppProject per environment: prod Applications can only target prod clusters.
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dev
  namespace: argocd
spec:
  description: All customer workloads in dev
  sourceRepos:
    - https://github.com/my-company/gcp-multi-tenant-platform.git
    - asia-south1-docker.pkg.dev/mtp-artifacts/charts
  destinations:
    - name: "*-dev-*"
      namespace: "*"
  clusterResourceWhitelist:
    - { group: "", kind: Namespace }
  namespaceResourceBlacklist:
    - { group: "", kind: ResourceQuota }   # quotas only via tenant-namespace chart review
---
