# Secrets, encryption keys and software supply chain (Stage 3 D9).
# Status: PROPOSED configuration, checked locally by tools/security/dataprotection.py (DP01-DP08). Not applied.
# Inputs reused: D2 identity plan (secrets, buckets, workload SAs), D3 access matrix (signer, version adders),
# D5 org policies (CMEK key projects, locations, Binary Authorization / trusted images), registry inventory.
schema_version: "1.0"

region: { name: asia-south1, short: as1, location_value: "in:asia-south1-locations" }   # A-D5-1 / Q10

secrets:
  # Stage 2 §5.3: secrets live in the customer's project; names <product>-<env>-<name> (generated by D2).
  replication: { type: user-managed, locations: [asia-south1] }      # add asia-south2 if DR is required (Q10)
  cmek_tiers: [prd]                                                   # Google-managed keys in non-prod
  terraform_manages_values: false     # Terraform creates the secret CONTAINER only; never a secret version, so no
                                      # value reaches Git or Terraform state (tf-plan identities can read state)
  values_written_by: matrix           # roles/secretmanager.secretVersionAdder grants in the access matrix (D3/D7)
  rotation_review_days: 90            # owner adds a new version; the previous one is disabled after the next deploy
  version_destroy_ttl_days: 30        # destroyed versions recoverable for 30 days

kms:
  cmek_tiers: [prd]
  tenant:                              # Q13 baseline: keys in the customer's project
    key_ring: "kr-{tenant}-{tier}-{region_short}"
    key: "{product}-{env}"
  platform:                            # pooled Cloud SQL: one key per instance (instance-level CMEK), central project
    project: shr-security
    key_ring: "kr-plt-{tier}-{region_short}"
    key: "{pool}"
  purpose: ENCRYPT_DECRYPT
  protection_level: SOFTWARE           # HSM is an option for the dedicated tier (cost) – Q13
  rotation_days: 90
  destroy_scheduled_days: 30
  key_users: service-agents-only       # workloads never get key permissions; CMEK is used by the service agent

supply_chain:
  build_gates:                         # run in shr-build before signing (ADR-010)
    - "Artifact Analysis vulnerability scan: no fixable CRITICAL findings"
    - "version not in the product's blocked_versions (registry)"
    - "image pushed to the release repository by builder@shr-build, referenced by digest"
  attestor:
    project: shr-build
    name: built-by-shr-build
    note: built-by-shr-build
    signer: "sa:builder@shr-build"
    key: { key_ring: kr-build-as1, key: attestor-signing, purpose: ASYMMETRIC_SIGN, algorithm: EC_SIGN_P256_SHA256, protection_level: HSM }
  binary_authorization:
    prd:    { evaluation_mode: REQUIRE_ATTESTATION, enforcement_mode: ENFORCED_BLOCK_AND_AUDIT_LOG }
    nonprd: { evaluation_mode: REQUIRE_ATTESTATION, enforcement_mode: DRYRUN_AUDIT_LOG_ONLY }   # dev uses unsigned snapshots
    global_policy_evaluation: ENABLE   # Google-maintained system images
    breakglass: { allowed: true, alert: AL-BINAUTHZ-BREAKGLASS }
  vm_images: { trusted_image_project: shr-build }   # Binary Authorization does not cover Compute Engine; org policy does
