# platform-ansible – pull requests: lint only (no cloud identity).
name: pr
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ansible-core==2.17.5 ansible-lint==24.9.2 && ansible-lint playbooks roles
