# Access-control matrix (Stage 3 D3) – source of truth for human and pipeline access.
# Workload (per-tenant) access is generated by D2 (tools/identity/derive.py) and summarised in the rendered view.
#
# principal: group (grp-...) or pipeline service account (sa:<id>@<project>)
# scope:     org | folder:<name> | project:<name> | k8s:<cluster-glob>/<namespace-glob> | mysql:<pool-glob>
#            | repo:<release|snapshot> | kms:<key> | groups:<group-glob> | billing
#            | sa-set:<name> (resource-level bindings on a generated set of service accounts)
#            | bucket:<name> | attestor:<project>/<attestor> | subnet:<subnet-glob> (Shared VPC subnets, Stage 4)
# condition: optional IAM condition (CEL) limiting the grant, e.g. to one product's secrets (D9)
# access:    standing | jit (PAM entitlement, see D7) | expiring (time-bound group membership, K21) | breakglass
# Status: implemented and checked locally (AC01-AC12); not applied to any GCP organisation.
schema_version: "1.0"

personas:
  platform-administrators:       { assignment_persona: "Platform administrators",        principals: [grp-hum-platform-admins] }
  devops-engineers:              { assignment_persona: "DevOps engineers",               principals: [grp-hum-platform-nonprd-operators, grp-hum-platform-prd-operators] }
  product-development-teams:     { assignment_persona: "Product development teams",      principals: ["grp-hum-product-{product}-dev", "grp-hum-product-{product}-prd-viewers"] }
  customer-specific-users:       { assignment_persona: "Customer-specific users",        principals: ["grp-hum-cust-{tenant}-support-prd", "grp-hum-cust-{tenant}-support-nonprd"] }
  production-support-engineers:  { assignment_persona: "Production support engineers",   principals: [grp-hum-platform-prd-operators, grp-hum-dba-prd-ro, grp-hum-dba-prd-admin] }
  automated-deployment-pipelines: { assignment_persona: "Automated deployment pipelines", principals: ["sa:tf-prd@shr-cicd-prd", "sa:tf-nonprd@shr-cicd-nonprd", "sa:deploy-prd@shr-cicd-prd", "sa:deploy-nonprd@shr-cicd-nonprd", "sa:builder@shr-build", "sa:ansible-prd@shr-cicd-prd", "sa:ansible-nonprd@shr-cicd-nonprd", "sa:sqlboot-prd@plt-sql-prd-{nn}", "sa:sqlboot-nonprd@plt-sql-nonprd-{nn}", "sa:groups-mgr-prd@shr-cicd-prd", "sa:groups-mgr-nonprd@shr-cicd-nonprd", "sa:isotest-prd@shr-cicd-prd", "sa:isotest-nonprd@shr-cicd-nonprd", "sa:tf-org@bootstrap-seed", "sa:tf-plan-org@bootstrap-seed", "sa:tf-plan-prd@shr-cicd-prd", "sa:tf-plan-nonprd@shr-cicd-nonprd"] }
  security-and-audit:            { assignment_persona: null, principals: [grp-hum-security-audit] }
  emergency-access:              { assignment_persona: null, principals: [grp-hum-prd-breakglass] }
  non-production-dbas:           { assignment_persona: null, principals: [grp-hum-dba-nonprd] }

pipeline_memberships:            # pipeline SAs that share base permissions through a pipeline group
  grp-pl-prd-deployers:    ["sa:deploy-prd@shr-cicd-prd"]
  grp-pl-nonprd-deployers: ["sa:deploy-nonprd@shr-cicd-nonprd"]

grants:
  # ---------------- Platform administrators (org) ----------------
  - { principal: grp-hum-platform-admins, scope: org, roles: [roles/resourcemanager.organizationViewer, roles/resourcemanager.folderViewer, roles/iam.securityReviewer, roles/cloudasset.viewer], access: standing }
  - { principal: grp-hum-platform-admins, scope: org, roles: [roles/resourcemanager.organizationAdmin, roles/resourcemanager.folderAdmin], access: jit, entitlement: pam-org-admin, max_hours: 2 }

  # ---------------- Security / audit ----------------
  - { principal: grp-hum-security-audit, scope: org, roles: [roles/iam.securityReviewer, roles/securitycenter.adminViewer, roles/cloudasset.viewer, roles/logging.viewer], access: standing }
  - { principal: grp-hum-security-audit, scope: project:shr-security, roles: [roles/logging.privateLogViewer], access: standing, exception: "security team reads audit logs (incl. Data Access logs) as its standing duty; reviewed quarterly" }

  # D7: Cloud Identity group managers for the time-bound groups (approval by the group owner first)
  - { principal: grp-hum-security-audit, scope: "groups:grp-hum-dba-prd-admin", roles: [cloudidentity/group-manager], access: standing, exception: "adds approved members with mandatory expiry (K21, D7); every change alerts (D10)" }

  # D9: secret VALUES are written by the owning product team, never committed; condition limits to its own product's secrets
  - { principal: "grp-hum-product-{product}-dev", scope: folder:tenants-nonprd, roles: [roles/secretmanager.secretVersionAdder], access: standing, condition: "resource.name.extract('/secrets/{name}/').startsWith('{product}-')" }
  - { principal: "grp-hum-product-{product}-prd-viewers", scope: folder:tenants-prd, roles: [roles/secretmanager.secretVersionAdder], access: jit, entitlement: "pam-prd-secret-write-{product}", max_hours: 1, condition: "resource.name.extract('/secrets/{name}/').startsWith('{product}-')" }

  # ---------------- Break-glass ----------------
  - { principal: grp-hum-prd-breakglass, scope: org, roles: [roles/resourcemanager.organizationAdmin], access: breakglass, note: "membership change and any use alert the security team" }

  # ---------------- DevOps / platform operators ----------------
  - { principal: grp-hum-platform-nonprd-operators, scope: folder:tenants-nonprd, roles: [roles/browser, roles/monitoring.viewer, roles/logging.viewer, roles/run.viewer, roles/compute.viewer, roles/cloudsql.viewer], access: standing }
  - { principal: grp-hum-platform-nonprd-operators, scope: folder:platform-nonprd, roles: [roles/browser, roles/monitoring.viewer, roles/logging.viewer, roles/container.viewer, roles/cloudsql.viewer], access: standing }
  - { principal: grp-hum-platform-nonprd-operators, scope: "k8s:gke-dev-*/*", roles: [k8s/edit], access: standing, note: "Dev only; Stage and UAT change only through pipelines" }
  - { principal: grp-hum-platform-nonprd-operators, scope: "k8s:gke-stg-*/*", roles: [k8s/view], access: standing }
  - { principal: grp-hum-platform-nonprd-operators, scope: "k8s:gke-uat-*/*", roles: [k8s/view], access: standing }

  # ---------------- Production support (standing read, JIT write) ----------------
  - { principal: grp-hum-platform-prd-operators, scope: folder:tenants-prd, roles: [roles/browser, roles/monitoring.viewer, roles/logging.viewer, roles/run.viewer, roles/compute.viewer, roles/errorreporting.viewer], access: standing }
  - { principal: grp-hum-platform-prd-operators, scope: folder:platform-prd, roles: [roles/browser, roles/monitoring.viewer, roles/logging.viewer, roles/container.viewer, roles/cloudsql.viewer], access: standing }
  - { principal: grp-hum-platform-prd-operators, scope: "k8s:gke-prd-*/*", roles: [k8s/view], access: standing }
  - { principal: grp-hum-platform-prd-operators, scope: folder:platform-prd, roles: [roles/container.developer], access: jit, entitlement: pam-prd-support-write, max_hours: 4 }
  - { principal: grp-hum-platform-prd-operators, scope: folder:tenants-prd, roles: [roles/run.developer, roles/compute.instanceAdmin.v1], access: jit, entitlement: pam-prd-support-write, max_hours: 4 }

  # ---------------- DBAs (mechanism 2 groups: login via IAM + group database role) ----------------
  - { principal: grp-hum-dba-prd-ro, scope: "project:plt-sql-prd-{nn}", roles: [roles/cloudsql.viewer, roles/cloudsql.client, roles/cloudsql.instanceUser], access: standing }
  - { principal: grp-hum-dba-prd-ro, scope: "mysql:sql-prd-*", roles: [mysql/r_platform_dba_ro], access: standing }
  - { principal: grp-hum-dba-prd-admin, scope: "project:plt-sql-prd-{nn}", roles: [roles/cloudsql.client, roles/cloudsql.instanceUser], access: expiring, max_hours: 4, note: "K21: time-bound group membership after approval; PAM cannot grant membership" }
  - { principal: grp-hum-dba-prd-admin, scope: "mysql:sql-prd-*", roles: [mysql/r_platform_dba_admin], access: expiring, max_hours: 4 }
  - { principal: grp-hum-dba-nonprd, scope: "project:plt-sql-nonprd-{nn}", roles: [roles/cloudsql.viewer, roles/cloudsql.client, roles/cloudsql.instanceUser], access: standing }
  - { principal: grp-hum-dba-nonprd, scope: "mysql:sql-dev-*", roles: [mysql/r_platform_dba_admin], access: standing }
  - { principal: grp-hum-dba-nonprd, scope: "mysql:sql-stg-*", roles: [mysql/r_platform_dba_ro], access: standing }
  - { principal: grp-hum-dba-nonprd, scope: "mysql:sql-uat-*", roles: [mysql/r_platform_dba_ro], access: standing }

  # ---------------- Product development teams ----------------
  - { principal: "grp-hum-product-{product}-dev", scope: folder:tenants-nonprd, roles: [roles/monitoring.viewer, roles/logging.viewer, roles/run.viewer, roles/errorreporting.viewer], access: standing, note: "non-prod data is synthetic or masked" }
  - { principal: "grp-hum-product-{product}-dev", scope: "k8s:gke-dev-*/*-{product}-dev", roles: [k8s/view], access: standing }
  - { principal: "grp-hum-product-{product}-dev", scope: "k8s:gke-stg-*/*-{product}-stg", roles: [k8s/view], access: standing }
  - { principal: "grp-hum-product-{product}-prd-viewers", scope: folder:tenants-prd, roles: [roles/monitoring.viewer, roles/errorreporting.viewer], access: standing, note: "metrics and errors only; prod logs via production support" }

  # ---------------- Customer-specific users (own customer only) ----------------
  - { principal: "grp-hum-cust-{tenant}-support-prd", scope: "project:t-{tenant}-prd", roles: [roles/browser, roles/monitoring.viewer, roles/logging.viewer, roles/run.viewer, roles/compute.viewer], access: standing, note: "customer GKE logs routed into this project (G4)" }
  - { principal: "grp-hum-cust-{tenant}-support-prd", scope: "k8s:gke-prd-*/{tenant}-*", roles: [k8s/view], access: standing }
  - { principal: "grp-hum-cust-{tenant}-support-nonprd", scope: "project:t-{tenant}-nonprd", roles: [roles/browser, roles/monitoring.viewer, roles/logging.viewer, roles/run.viewer, roles/compute.viewer], access: standing }
  - { principal: "grp-hum-cust-{tenant}-support-nonprd", scope: "k8s:gke-uat-*/{tenant}-*", roles: [k8s/view], access: standing }

  # ---------------- Pipelines: Terraform ----------------
  - { principal: "sa:tf-nonprd@shr-cicd-nonprd", scope: folder:tenants-nonprd, roles: [roles/resourcemanager.projectCreator, roles/resourcemanager.projectIamAdmin, roles/iam.serviceAccountAdmin, roles/storage.admin, roles/secretmanager.admin, roles/cloudkms.admin, roles/run.developer, roles/compute.instanceAdmin.v1], access: standing }
  - { principal: "sa:tf-nonprd@shr-cicd-nonprd", scope: folder:platform-nonprd, roles: [roles/resourcemanager.projectCreator, roles/resourcemanager.projectIamAdmin, roles/container.admin, roles/cloudsql.admin], access: standing }
  - { principal: "sa:tf-nonprd@shr-cicd-nonprd", scope: project:net-host-nonprd, roles: [roles/compute.xpnAdmin], access: standing }
  - { principal: "sa:tf-prd@shr-cicd-prd", scope: folder:tenants-prd, roles: [roles/resourcemanager.projectCreator, roles/resourcemanager.projectIamAdmin, roles/iam.serviceAccountAdmin, roles/storage.admin, roles/secretmanager.admin, roles/cloudkms.admin, roles/run.developer, roles/compute.instanceAdmin.v1], access: standing, note: "only usable from GitHub environment prd on protected main (ADR-010)" }
  - { principal: "sa:tf-prd@shr-cicd-prd", scope: folder:platform-prd, roles: [roles/resourcemanager.projectCreator, roles/resourcemanager.projectIamAdmin, roles/container.admin, roles/cloudsql.admin], access: standing }
  - { principal: "sa:tf-prd@shr-cicd-prd", scope: project:net-host-prd, roles: [roles/compute.xpnAdmin], access: standing }
  - { principal: "sa:tf-prd@shr-cicd-prd", scope: billing, roles: [roles/billing.user], access: standing }
  - { principal: "sa:tf-nonprd@shr-cicd-nonprd", scope: billing, roles: [roles/billing.user], access: standing }

  # D6: Terraform state per tier, triggering the DB bootstrap / isolation-test jobs, org stacks, read-only PR plans
  - { principal: "sa:tf-nonprd@shr-cicd-nonprd", scope: bucket:tfstate-nonprd, roles: [roles/storage.objectAdmin], access: standing }
  - { principal: "sa:tf-prd@shr-cicd-prd", scope: bucket:tfstate-prd, roles: [roles/storage.objectAdmin], access: standing }
  - { principal: "sa:tf-nonprd@shr-cicd-nonprd", scope: "project:plt-sql-nonprd-{nn}", roles: [roles/run.invoker], access: standing, note: "runs the DB bootstrap job (sqlboot-nonprd)" }
  - { principal: "sa:tf-prd@shr-cicd-prd", scope: "project:plt-sql-prd-{nn}", roles: [roles/run.invoker], access: standing, note: "runs the DB bootstrap job (sqlboot-prd)" }
  - { principal: "sa:tf-nonprd@shr-cicd-nonprd", scope: project:shr-cicd-nonprd, roles: [roles/run.invoker], access: standing, note: "runs the isolation-test job (isotest-nonprd)" }
  - { principal: "sa:tf-prd@shr-cicd-prd", scope: project:shr-cicd-prd, roles: [roles/run.invoker], access: standing, note: "runs the isolation-test job (isotest-prd)" }
  - { principal: "sa:tf-org@bootstrap-seed", scope: org, roles: [roles/resourcemanager.folderAdmin, roles/orgpolicy.policyAdmin, roles/iam.securityAdmin, roles/privilegedaccessmanager.admin], access: standing, note: "org stacks only (folders, org policies D5, org IAM D3, PAM entitlements D7); GitHub environment org, 2 platform-admin reviewers" }
  - { principal: "sa:tf-org@bootstrap-seed", scope: bucket:tfstate-org, roles: [roles/storage.objectAdmin], access: standing }
  - { principal: "sa:tf-plan-org@bootstrap-seed", scope: org, roles: [roles/iam.securityReviewer, roles/cloudasset.viewer, roles/resourcemanager.folderViewer, roles/orgpolicy.policyViewer], access: standing, note: "read-only PR plans of org stacks" }
  - { principal: "sa:tf-plan-org@bootstrap-seed", scope: bucket:tfstate-org, roles: [roles/storage.objectViewer], access: standing }
  - { principal: "sa:tf-plan-nonprd@shr-cicd-nonprd", scope: folder:tenants-nonprd, roles: [roles/browser, roles/iam.securityReviewer, roles/compute.viewer, roles/run.viewer, roles/cloudsql.viewer, roles/secretmanager.viewer, roles/cloudkms.viewer], access: standing, note: "read-only PR plans; secret metadata only, never values" }
  - { principal: "sa:tf-plan-nonprd@shr-cicd-nonprd", scope: folder:platform-nonprd, roles: [roles/browser, roles/iam.securityReviewer, roles/container.viewer, roles/cloudsql.viewer, roles/run.viewer], access: standing }
  - { principal: "sa:tf-plan-nonprd@shr-cicd-nonprd", scope: bucket:tfstate-nonprd, roles: [roles/storage.objectViewer], access: standing, note: "plans run with -lock=false" }
  - { principal: "sa:tf-plan-prd@shr-cicd-prd", scope: folder:tenants-prd, roles: [roles/browser, roles/iam.securityReviewer, roles/compute.viewer, roles/run.viewer, roles/cloudsql.viewer, roles/secretmanager.viewer, roles/cloudkms.viewer], access: standing, note: "read-only PR plans; secret metadata only, never values" }
  - { principal: "sa:tf-plan-prd@shr-cicd-prd", scope: folder:platform-prd, roles: [roles/browser, roles/iam.securityReviewer, roles/container.viewer, roles/cloudsql.viewer, roles/run.viewer], access: standing }
  - { principal: "sa:tf-plan-prd@shr-cicd-prd", scope: bucket:tfstate-prd, roles: [roles/storage.objectViewer], access: standing, note: "plans run with -lock=false; prd state is readable by the plan identity – state must hold no secret values (D9)" }

  # Stage 5: permissions the Terraform stacks need (terraform/stacks.yaml `requires`, checked by SK02)
  - { principal: "sa:tf-org@bootstrap-seed", scope: org, roles: [roles/compute.orgFirewallPolicyAdmin, roles/logging.configWriter, roles/compute.xpnAdmin], access: standing, note: "hierarchical firewall (N3), org audit sink (D10), Shared VPC host enablement" }
  - { principal: "sa:tf-org@bootstrap-seed", scope: folder:shared, roles: [roles/resourcemanager.projectCreator], access: standing }
  - { principal: "sa:tf-org@bootstrap-seed", scope: folder:network, roles: [roles/resourcemanager.projectCreator], access: standing }
  - { principal: "sa:tf-org@bootstrap-seed", scope: billing, roles: [roles/billing.user], access: standing }
  - { principal: "sa:tf-org@bootstrap-seed", scope: "groups:*", roles: [cloudidentity/groups-admin], access: standing, note: "creates groups; memberships of grp-wl-* are managed by groups-mgr-<tier>, human memberships by the IdP" }
  - { principal: "sa:tf-nonprd@shr-cicd-nonprd", scope: project:net-host-nonprd, roles: [roles/compute.networkAdmin, roles/compute.securityAdmin, roles/dns.admin, roles/resourcemanager.tagAdmin, roles/servicenetworking.networksAdmin], access: standing }
  - { principal: "sa:tf-prd@shr-cicd-prd", scope: project:net-host-prd, roles: [roles/compute.networkAdmin, roles/compute.securityAdmin, roles/dns.admin, roles/resourcemanager.tagAdmin, roles/servicenetworking.networksAdmin], access: standing }
  - { principal: "sa:tf-nonprd@shr-cicd-nonprd", scope: folder:platform-nonprd, roles: [roles/run.developer, roles/binaryauthorization.policyEditor], access: standing }
  - { principal: "sa:tf-prd@shr-cicd-prd", scope: folder:platform-prd, roles: [roles/run.developer, roles/binaryauthorization.policyEditor], access: standing }
  - { principal: "sa:tf-nonprd@shr-cicd-nonprd", scope: folder:tenants-nonprd, roles: [roles/compute.loadBalancerAdmin, roles/binaryauthorization.policyEditor], access: standing }
  - { principal: "sa:tf-prd@shr-cicd-prd", scope: folder:tenants-prd, roles: [roles/compute.loadBalancerAdmin, roles/binaryauthorization.policyEditor], access: standing }
  - { principal: "sa:tf-nonprd@shr-cicd-nonprd", scope: project:plt-ingress-nonprd, roles: [roles/compute.loadBalancerAdmin, roles/compute.securityAdmin, roles/certificatemanager.owner], access: standing }
  - { principal: "sa:tf-prd@shr-cicd-prd", scope: project:plt-ingress-prd, roles: [roles/compute.loadBalancerAdmin, roles/compute.securityAdmin, roles/certificatemanager.owner], access: standing }
  - { principal: "sa:tf-nonprd@shr-cicd-nonprd", scope: kms:shr-security/kr-plt-nonprd-as1, roles: [roles/cloudkms.admin], access: standing }
  - { principal: "sa:tf-prd@shr-cicd-prd", scope: kms:shr-security/kr-plt-prd-as1, roles: [roles/cloudkms.admin], access: standing, note: "pool instance keys (D9)" }
  # ---------------- Stage 8: observability stack and per-customer uptime checks ----------------
  - { principal: "sa:tf-nonprd@shr-cicd-nonprd", scope: folder:platform-nonprd, roles: [roles/monitoring.admin], access: standing, note: "S8: plt-obs metrics scopes, SLOs, alert policies, dashboards (scope link needs it on both sides)" }
  - { principal: "sa:tf-prd@shr-cicd-prd", scope: folder:platform-prd, roles: [roles/monitoring.admin], access: standing, note: "S8: plt-obs metrics scopes, SLOs, alert policies, dashboards" }
  - { principal: "sa:tf-nonprd@shr-cicd-nonprd", scope: folder:tenants-nonprd, roles: [roles/monitoring.admin], access: standing, note: "S8: tenant projects joined to the metrics scope" }
  - { principal: "sa:tf-prd@shr-cicd-prd", scope: folder:tenants-prd, roles: [roles/monitoring.admin], access: standing, note: "S8: uptime checks per customer hostname live in t-<cust>-prd" }
  - { principal: "sa:tf-plan-nonprd@shr-cicd-nonprd", scope: folder:platform-nonprd, roles: [roles/monitoring.viewer], access: standing }
  - { principal: "sa:tf-plan-nonprd@shr-cicd-nonprd", scope: folder:tenants-nonprd, roles: [roles/monitoring.viewer], access: standing }
  - { principal: "sa:tf-plan-prd@shr-cicd-prd", scope: folder:platform-prd, roles: [roles/monitoring.viewer], access: standing }
  - { principal: "sa:tf-plan-prd@shr-cicd-prd", scope: folder:tenants-prd, roles: [roles/monitoring.viewer], access: standing }
  - { principal: "sa:tf-nonprd@shr-cicd-nonprd", scope: project:plt-ingress-nonprd, roles: [roles/logging.configWriter], access: standing, note: "S8: log-based SLI metrics of Shared / Cohort products" }
  - { principal: "sa:tf-prd@shr-cicd-prd", scope: project:plt-ingress-prd, roles: [roles/logging.configWriter], access: standing, note: "S8: log-based SLI metrics of Shared / Cohort products" }
  # ---------------- Stage 7: nightly drift export DR02 (group membership read) ----------------
  - { principal: "sa:tf-plan-org@bootstrap-seed", scope: "groups:grp-*", roles: [cloudidentity/groups-reader], access: standing, note: "S7 drift workflow; Cloud Identity admin role assigned in the Admin console, not by Terraform (T-CI6)" }

  # ---------------- Pipelines: application deploy ----------------
  - { principal: grp-pl-nonprd-deployers, scope: repo:release, roles: [roles/artifactregistry.reader], access: standing }
  - { principal: grp-pl-nonprd-deployers, scope: repo:snapshot, roles: [roles/artifactregistry.reader], access: standing }
  - { principal: grp-pl-prd-deployers, scope: repo:release, roles: [roles/artifactregistry.reader], access: standing }
  - { principal: "sa:deploy-nonprd@shr-cicd-nonprd", scope: "k8s:gke-dev-*/*", roles: [k8s/edit], access: standing, note: "tenant namespaces only; platform namespaces excluded by RBAC" }
  - { principal: "sa:deploy-nonprd@shr-cicd-nonprd", scope: "k8s:gke-stg-*/*", roles: [k8s/edit], access: standing }
  - { principal: "sa:deploy-nonprd@shr-cicd-nonprd", scope: "k8s:gke-uat-*/*", roles: [k8s/edit], access: standing }
  - { principal: "sa:deploy-nonprd@shr-cicd-nonprd", scope: project:plt-gke-nonprd, roles: [roles/container.developer], access: standing }
  - { principal: "sa:deploy-nonprd@shr-cicd-nonprd", scope: folder:tenants-nonprd, roles: [roles/run.developer, roles/compute.instanceAdmin.v1, roles/iam.serviceAccountUser], access: standing, note: "serviceAccountUser lets it attach tenant runtime SAs to Cloud Run / MIG templates" }
  - { principal: "sa:deploy-prd@shr-cicd-prd", scope: "k8s:gke-prd-*/*", roles: [k8s/edit], access: standing }
  - { principal: "sa:deploy-prd@shr-cicd-prd", scope: project:plt-gke-prd, roles: [roles/container.developer], access: standing }
  - { principal: "sa:deploy-prd@shr-cicd-prd", scope: folder:tenants-prd, roles: [roles/run.developer, roles/compute.instanceAdmin.v1, roles/iam.serviceAccountUser], access: standing, note: "B1: split into per-tenant prod deployers later" }

  # ---------------- Pipelines: build ----------------
  - { principal: "sa:builder@shr-build", scope: repo:release, roles: [roles/artifactregistry.writer, roles/containeranalysis.notes.attacher], access: standing }
  - { principal: "sa:builder@shr-build", scope: repo:snapshot, roles: [roles/artifactregistry.writer], access: standing }
  - { principal: "sa:builder@shr-build", scope: kms:shr-build/attestor-signing, roles: [roles/cloudkms.signerVerifier], access: standing }
  - { principal: "sa:builder@shr-build", scope: attestor:shr-build/built-by-shr-build, roles: [roles/containeranalysis.notes.attacher, roles/containeranalysis.occurrences.editor], access: standing, note: "D9: creates Binary Authorization attestations (occurrences stored in shr-build)" }

  # ---------------- Pipelines: Ansible (B15: per-run scoping later) ----------------
  - { principal: "sa:ansible-nonprd@shr-cicd-nonprd", scope: folder:tenants-nonprd, roles: [roles/iap.tunnelResourceAccessor, roles/compute.osAdminLogin], access: standing }
  - { principal: "sa:ansible-prd@shr-cicd-prd", scope: folder:tenants-prd, roles: [roles/iap.tunnelResourceAccessor, roles/compute.osAdminLogin], access: standing, note: "B15 – tenant-scoped per-run identity planned" }

  # ---------------- Pipelines: database bootstrap + group management ----------------
  - { principal: "sa:sqlboot-nonprd@plt-sql-nonprd-{nn}", scope: "project:plt-sql-nonprd-{nn}", roles: [roles/cloudsql.client, roles/cloudsql.instanceUser], access: standing }
  - { principal: "sa:sqlboot-nonprd@plt-sql-nonprd-{nn}", scope: "mysql:sql-dev-*", roles: [mysql/cloudsqlsuperuser], access: standing }
  - { principal: "sa:sqlboot-nonprd@plt-sql-nonprd-{nn}", scope: "mysql:sql-stg-*", roles: [mysql/cloudsqlsuperuser], access: standing }
  - { principal: "sa:sqlboot-nonprd@plt-sql-nonprd-{nn}", scope: "mysql:sql-uat-*", roles: [mysql/cloudsqlsuperuser], access: standing }
  - { principal: "sa:sqlboot-prd@plt-sql-prd-{nn}", scope: "project:plt-sql-prd-{nn}", roles: [roles/cloudsql.client, roles/cloudsql.instanceUser], access: standing }
  - { principal: "sa:sqlboot-prd@plt-sql-prd-{nn}", scope: "mysql:sql-prd-*", roles: [mysql/cloudsqlsuperuser], access: standing }
  # D4 isolation-test harness: impersonates ONLY the database-user SAs of its tier (resource-level bindings generated
  # by tools/db/grants.py -> build/sql/isotest-impersonation.json), never a folder or project binding. Probes are
  # non-destructive and never read tenant rows; any token minted outside the gate job is alerted on (D10).
  - { principal: "sa:isotest-nonprd@shr-cicd-nonprd", scope: "sa-set:db-users-nonprd", roles: [roles/iam.serviceAccountTokenCreator], access: standing, note: "D4 ISO probes; cross-tenant by design, see risk R-D4-1" }
  - { principal: "sa:isotest-prd@shr-cicd-prd", scope: "sa-set:db-users-prd", roles: [roles/iam.serviceAccountTokenCreator], access: standing, note: "D4 ISO probes; cross-tenant by design, see risk R-D4-1" }
  - { principal: "sa:groups-mgr-nonprd@shr-cicd-nonprd", scope: "groups:grp-wl-*-nonprd*", roles: [cloudidentity/group-manager], access: standing }
  - { principal: "sa:groups-mgr-prd@shr-cicd-prd", scope: "groups:grp-wl-*-prd*", roles: [cloudidentity/group-manager], access: standing }

  # ---------------- Workload groups (mechanism 1, connect / pull / subnet only) ----------------
  - { principal: "grp-wl-sqlconn-prd-{nn}", scope: "project:plt-sql-prd-{nn}", roles: [roles/cloudsql.client, roles/cloudsql.instanceUser], access: standing }
  - { principal: "grp-wl-sqlconn-nonprd-{nn}", scope: "project:plt-sql-nonprd-{nn}", roles: [roles/cloudsql.client, roles/cloudsql.instanceUser], access: standing }
  - { principal: grp-wl-ar-readers-prd, scope: repo:release, roles: [roles/artifactregistry.reader], access: standing }
  - { principal: grp-wl-ar-readers-nonprd, scope: repo:release, roles: [roles/artifactregistry.reader], access: standing }
  - { principal: grp-wl-ar-readers-nonprd, scope: repo:snapshot, roles: [roles/artifactregistry.reader], access: standing }
  # Stage 4 N2: Network User only on the tier's runtime subnets (subnet-level); Network Viewer on the host project.
  - { principal: grp-wl-netusers-prd, scope: project:net-host-prd, roles: [roles/compute.networkViewer], access: standing }
  - { principal: grp-wl-netusers-prd, scope: "subnet:snet-prd-as1-*", roles: [roles/compute.networkUser], access: standing, note: "run, mig and per-cell gke subnets (network/vpc.yaml)" }
  - { principal: grp-wl-netusers-nonprd, scope: project:net-host-nonprd, roles: [roles/compute.networkViewer], access: standing }
  - { principal: grp-wl-netusers-nonprd, scope: "subnet:snet-nonprd-as1-*", roles: [roles/compute.networkUser], access: standing }
