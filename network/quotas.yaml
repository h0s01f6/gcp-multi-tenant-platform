# Network quota and limit register (Stage 4 N5, review B14 – networking part).
# value: the limit if confirmed from Google documentation in this project; null = not confirmed (validation item).
# usage: computed by tools/network/quotas.py from the Stage 4 plans at the capacity-model upper bound.
schema_version: "1.0"
alert_threshold: 0.8                      # alert at 80 % of a known limit (Cloud Monitoring quota metrics, D10 channels)
quotas:
