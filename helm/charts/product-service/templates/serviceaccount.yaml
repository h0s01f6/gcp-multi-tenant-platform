apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ps.name" . }}
  labels:
    {{- include "ps.labels" . | nindent 4 }}
  annotations:
    # Workload Identity: this KSA acts as the product's GSA in the customer's project only.
    iam.gke.io/gcp-service-account: {{ include "ps.gsa" . }}
