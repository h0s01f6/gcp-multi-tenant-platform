# Run by Packer in shr-build (ADR-010): produces image family <product> in shr-build (D9 trusted image project).
- name: Bake product image
  hosts: all
  become: true
  vars:
    product: "{{ lookup('env', 'PRODUCT') }}"
    app_version: "{{ lookup('env', 'APP_VERSION') }}"     # registry version; artifact fetched by digest-pinned URL
  pre_tasks:
    - name: Require product and version
      ansible.builtin.assert:
        that: [product | length > 0, app_version | length > 0]
  roles:
    - base
    - app
