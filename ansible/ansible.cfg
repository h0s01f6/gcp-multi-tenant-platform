[defaults]
inventory = inventories/gcp.yml
roles_path = roles
host_key_checking = True
forks = 20
interpreter_python = auto_silent

[ssh_connection]
# OS Login + IAP TCP forwarding (no external IPs, no SSH keys in metadata – D5/N3)
ssh_args = -o ProxyCommand="gcloud compute start-iap-tunnel %h 22 --listen-on-stdin --zone=%z --verbosity=warning"
pipelining = True
