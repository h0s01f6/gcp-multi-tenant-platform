apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ps.name" . }}-config
  labels:
    {{- include "ps.labels" . | nindent 4 }}
data:
  CUSTOMER: {{ .Values.customer | quote }}
  ENVIRONMENT: {{ .Values.env | quote }}
  PRODUCT: {{ .Values.product | quote }}
  VERSION: {{ .Values.version | quote }}
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
  {{- range $k, $v := .Values.featureFlags }}
  FF_{{ $k | snakecase | upper }}: {{ $v | toString | quote }}
  {{- end }}
