{{- if .Values.route.enabled }}
# Attaches to the cluster's shared Gateway (gitops/platform/gateway.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "ps.name" . }}
  labels:
    {{- include "ps.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.route.gatewayName }}
      namespace: {{ .Values.route.gatewayNamespace }}
  hostnames:
    - {{ include "ps.hostname" . | quote }}
  rules:
    - backendRefs:
        - name: {{ include "ps.name" . }}
          port: 80
{{- end }}
