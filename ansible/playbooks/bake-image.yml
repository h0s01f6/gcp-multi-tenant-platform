# Run by Packer on a temporary VM to produce the golden image <product>-<version>.
# Customer-specific settings are NOT baked in; they arrive at boot from instance metadata
# and Secret Manager, so one image per version serves every customer.
- name: Bake product image
  hosts: all
  become: true
  vars:
    product: "{{ lookup('env', 'PRODUCT') }}"
    version: "{{ lookup('env', 'VERSION') }}"
  roles:
    - product_runtime
