  gke_cell_subnets_per_vpc:             { value: null, owner: platform-network, validation: T-N3 }
  cloud_sql_instances_per_psa_range:    { value: 12800, owner: platform-db, note: "/16 = 256 x /24, about 50 instances per /24 (Cloud SQL sizing table)" }
  cloud_run_ips_per_tier:               { value: 65536, owner: platform-network, note: "Direct VPC egress /16; about 2 IPs per instance" }
  nat_static_ips_per_region:            { value: null, owner: platform-network, validation: T-N12 }
  host_rules_per_url_map:               { value: null, owner: platform-network, validation: T-L1, note: "review B7 – one URL map per product per environment" }
  records_per_public_zone:              { value: null, owner: platform-network, validation: T-N10 }
  rules_per_network_firewall_policy:    { value: null, owner: platform-network, validation: T-N9 }
